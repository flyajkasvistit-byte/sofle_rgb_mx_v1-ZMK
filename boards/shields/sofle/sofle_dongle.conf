# Keep a local RGB state on the central so ZMK can dispatch the global
# underglow behavior to both peripheral halves. The single LED defined in the
# overlay is only a harmless state holder on the otherwise unconnected pin.
CONFIG_ZMK_RGB_UNDERGLOW=y
CONFIG_ZMK_RGB_UNDERGLOW_EXT_POWER=n

# Encoder events arrive from the peripheral halves; the dongle has no local
# EC11 devices to initialize.
CONFIG_EC11=n
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=n
